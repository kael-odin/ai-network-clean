# 打包配置:appId 独立,不会覆盖其他安装
appId: local.ain.clean
productName: AI Network Clean
copyright: AI Network Clean
artifactName: AI-Network-Clean-Setup-${version}.${ext}

directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - '!dist/**/*.map'
  - build/icon.png
  - package.json

asar: true

# 只留运行必需的打包内容。主进程/预加载已经被 esbuild 完整打包,运行时不需要 node_modules;
# electron 由 electron-builder 自己处理。以前把整个 node_modules 打进去是纯多余
# Electron fuses:去掉用环境变量给主进程注入代码的入口。
# runAsNode 保留:DNS 看守进程靠 ELECTRON_RUN_AS_NODE 以 Node 方式跑(见 sysdns.ts);等做到权限分离后可以关掉
electronFuses:
  runAsNode: true
  enableCookieEncryption: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: false
  onlyLoadAppFromAsar: true

# 内核和地理数据库放在 resources/(不打进 asar,内核要能直接执行)
extraResources:
  - from: resources
    to: .
    filter:
      - '**/*'

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  # TUN 虚拟网卡要管理员;没有权限时客户端自己退回本地代理模式
  requestedExecutionLevel: highestAvailable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI Network Clean
